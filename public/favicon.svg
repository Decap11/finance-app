<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PEWOSA SACCO">
  <!--
    Referenced by the root layout since the project began, but the file itself was never
    committed, so every page load 404'd on it and browsers fell back to a blank icon.

    Deliberately simple. The full logo -- a globe, cupped hands, three stacks of coins and two
    rings of text -- is unreadable at the 16px a browser tab actually renders, so this takes
    the one element that survives that size: a stack of coins, in the logo's gold, on the
    brand navy.
  -->
  <rect width="64" height="64" rx="14" fill="#253b8e"/>
  <g fill="#f5b70a">
    <ellipse cx="32" cy="20" rx="15" ry="5.5"/>
    <path d="M17 20v6c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v-6c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5z"/>
    <path d="M17 30v6c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v-6c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5z"/>
    <path d="M17 40v6c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v-6c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5z"/>
  </g>
</svg>
